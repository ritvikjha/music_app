apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

group = 'com.ritvik.jammusic.jarvis'
version = '0.1.0'

android {
    namespace 'com.ritvik.jammusic.jarvis'
    compileSdkVersion safeExtGet("compileSdkVersion", 35)

    defaultConfig {
        minSdkVersion safeExtGet("minSdkVersion", 24)
        targetSdkVersion safeExtGet("targetSdkVersion", 35)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${safeExtGet('kotlinVersion', '2.0.21')}"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0"
    implementation "androidx.core:core-ktx:1.13.1"

    // Expo Modules API
    implementation 'expo:expo-modules-core'

    // openWakeWord Android Kotlin wrapper (Apache-2.0)
    // https://github.com/Re-MENTIA/openwakeword-android-kt
    implementation 'xyz.rementia:openwakeword:0.1.3'
}

int safeExtGet(String prop, Integer fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

String safeExtGet(String prop, String fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
